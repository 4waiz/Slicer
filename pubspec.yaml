name: kanban_slicer
description: "Kanban Slicer - Cut Through Complexity. A one-swipe 3D physics slicing puzzle."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.2.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/models/
    - assets/audio/
    - assets/images/
    - assets/levels/
